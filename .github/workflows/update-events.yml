name: Update Munich Radar

on:
  workflow_dispatch:
  schedule:
    # UTC: 06/11/16/21 Uhr im Sommer, 05/10/15/20 Uhr im Winter (Berlin).
    - cron: '0 4,9,14,19 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: munich-radar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      updated: ${{ steps.pipeline.outcome }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test core logic and parsers (offline)
        run: python -m pytest -q
      - name: Collect and rank events
        id: pipeline
        run: python -m src.main
      - name: Build public website
        run: python -m src.build
      - name: Persist data and discovery history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/metadata.json data/source-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Munich Radar data [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Keep failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collector-diagnostics
          path: data/last-failure.json
          if-no-files-found: ignore

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
